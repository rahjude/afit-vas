<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Admin Login - AFIT VAS</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="auth-page" style="background:linear-gradient(135deg,var(--secondary) 0%,#0F172A 100%)">
        <div class="auth-card">
            <div class="auth-header" style="background:var(--secondary)">
                <h2>Admin Portal</h2>
                <p>AFIT Virtual Admission System</p>
            </div>
            <div class="auth-body">
                <div id="alert-box"></div>
                <form id="login-form">
                    <div class="form-group">
                        <label>Email Address</label>
                        <input type="email" name="email" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label>Password</label>
                        <input type="password" name="password" class="form-control" required>
                    </div>
                    <button type="submit" class="btn btn-primary btn-block btn-lg" id="submit-btn">Log In</button>
                </form>
                <p class="text-center mt-2 text-sm"><a href="/login.html">Applicant Login</a></p>
            </div>
        </div>
    </div>

    <script src="/js/api.js"></script>
    <script>
        if (Auth.isLoggedIn()) {
            const u = Auth.getUser();
            if (['admin','super_admin'].includes(u?.role)) {
                window.location.href = '/admin/dashboard.html';
            }
        }

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            clearAlert('alert-box');
            const btn = document.getElementById('submit-btn');
            btn.disabled = true; btn.textContent = 'Logging in...';

            const form = e.target;
            const res = await Api.post('/auth/login', {
                email: form.email.value.trim(),
                password: form.password.value,
            });

            if (res?.success) {
                const user = res.data.user;
                if (!['admin','super_admin'].includes(user.role)) {
                    showAlert('alert-box', 'Access denied. This portal is for administrators only.');
                    btn.disabled = false; btn.textContent = 'Log In';
                    return;
                }
                Auth.save(res.data.token, user);
                window.location.href = '/admin/dashboard.html';
            } else {
                showAlert('alert-box', res?.message || 'Login failed');
                btn.disabled = false; btn.textContent = 'Log In';
            }
        });
    </script>
</body>
</html>
