<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Applications - Admin - AFIT VAS</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <nav class="navbar" style="background:var(--secondary)">
        <a href="/admin/dashboard.html" class="navbar-brand">
            <div><h1>AFIT VAS Admin</h1><small>Air Force Institute of Technology</small></div>
        </a>
        <ul class="navbar-nav">
            <li><a href="/admin/dashboard.html">Dashboard</a></li>
            <li><a href="/admin/applications.html" class="active">Applications</a></li>
            <li><a href="/admin/reports.html">Reports</a></li>
            <li><span class="nav-user" id="nav-user-name"></span></li>
            <li><a href="#" id="logout-btn">Logout</a></li>
        </ul>
    </nav>

    <div class="container">
        <h2 class="mb-2">All Applications</h2>

        <div class="card mb-2">
            <div class="card-body">
                <div class="filter-bar">
                    <div class="form-group">
                        <label>Search</label>
                        <input type="text" id="filter-search" class="form-control" placeholder="Name, email, reference...">
                    </div>
                    <div class="form-group">
                        <label>Status</label>
                        <select id="filter-status" class="form-control">
                            <option value="all">All</option>
                            <option value="eligible">Eligible</option>
                            <option value="not_eligible">Not Eligible</option>
                            <option value="under_review">Under Review</option>
                            <option value="admitted">Admitted</option>
                            <option value="rejected">Rejected</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>From</label>
                        <input type="date" id="filter-from" class="form-control">
                    </div>
                    <div class="form-group">
                        <label>To</label>
                        <input type="date" id="filter-to" class="form-control">
                    </div>
                    <div class="form-group" style="flex:0">
                        <label>&nbsp;</label>
                        <div class="d-flex gap-1">
                            <button class="btn btn-primary btn-sm" onclick="loadApplications()">Search</button>
                            <button class="btn btn-outline btn-sm" onclick="resetFilters()">Reset</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="card">
            <div class="card-body">
                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>Reference</th>
                                <th>Applicant</th>
                                <th>Email</th>
                                <th>Programme</th>
                                <th>Status</th>
                                <th>Submitted</th>
                                <th></th>
                            </tr>
                        </thead>
                        <tbody id="apps-tbody">
                            <tr><td colspan="7" class="text-center"><div class="spinner"></div></td></tr>
                        </tbody>
                    </table>
                </div>
                <div class="pagination" id="pagination"></div>
            </div>
        </div>
    </div>

    <script src="/js/api.js"></script>
    <script>
        if (!Auth.requireLogin('admin')) throw '';
        setNavUser(`${Auth.getUser().first_name} ${Auth.getUser().last_name}`);

        let currentPage = 1;

        async function loadApplications(page = 1) {
            currentPage = page;
            const params = new URLSearchParams();
            params.set('page', page);
            params.set('per_page', '25');

            const search = document.getElementById('filter-search').value.trim();
            const status = document.getElementById('filter-status').value;
            const from = document.getElementById('filter-from').value;
            const to = document.getElementById('filter-to').value;

            if (search) params.set('search', search);
            if (status !== 'all') params.set('status', status);
            if (from) params.set('from_date', from);
            if (to) params.set('to_date', to);

            const res = await Api.get(`/admin/applications?${params}`);
            const tbody = document.getElementById('apps-tbody');

            if (res?.data?.data?.length) {
                tbody.innerHTML = res.data.data.map(a => `<tr>
                    <td><strong>${a.reference_number}</strong></td>
                    <td>${a.first_name} ${a.last_name}</td>
                    <td>${a.email}</td>
                    <td>${a.programme_code}</td>
                    <td>${statusBadge(a.status)}</td>
                    <td>${formatDate(a.submitted_at || a.created_at)}</td>
                    <td><a href="/admin/review.html?id=${a.id}" class="btn btn-sm btn-primary">Review</a></td>
                </tr>`).join('');

                // Pagination
                const { pagination } = res.data;
                let pagHtml = '';
                if (pagination.pages > 1) {
                    for (let i = 1; i <= pagination.pages; i++) {
                        pagHtml += `<button class="${i===page?'active':''}" onclick="loadApplications(${i})">${i}</button>`;
                    }
                }
                document.getElementById('pagination').innerHTML = pagHtml;
            } else {
                tbody.innerHTML = '<tr><td colspan="7" class="text-center text-muted">No applications found.</td></tr>';
                document.getElementById('pagination').innerHTML = '';
            }
        }

        function resetFilters() {
            document.getElementById('filter-search').value = '';
            document.getElementById('filter-status').value = 'all';
            document.getElementById('filter-from').value = '';
            document.getElementById('filter-to').value = '';
            loadApplications();
        }

        // Search on Enter
        document.getElementById('filter-search').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') loadApplications();
        });

        loadApplications();

        document.getElementById('logout-btn').addEventListener('click', (e) => {
            e.preventDefault(); Auth.clear(); window.location.href = '/admin/login.html';
        });
    </script>
</body>
</html>
