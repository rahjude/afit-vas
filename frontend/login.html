<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login - AFIT VAS</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="auth-page">
        <div class="auth-card">
            <div class="auth-header">
                <h2>Applicant Login</h2>
                <p>AFIT Virtual Admission System</p>
            </div>
            <div class="auth-body">
                <div id="alert-box"></div>
                <form id="login-form">
                    <div class="form-group">
                        <label>Email Address</label>
                        <input type="email" name="email" class="form-control" required id="email-input">
                    </div>
                    <div class="form-group">
                        <label>Password</label>
                        <input type="password" name="password" class="form-control" required>
                    </div>
                    <button type="submit" class="btn btn-primary btn-block btn-lg" id="submit-btn">Log In</button>
                </form>
                <p class="text-center mt-2 text-sm">Don't have an account? <a href="/register.html">Register</a></p>
                <p class="text-center mt-1 text-sm"><a href="/admin/login.html">Admin Portal</a></p>
            </div>
        </div>
    </div>

    <script src="/js/api.js"></script>
    <script>
        if (Auth.isLoggedIn()) window.location.href = '/dashboard.html';

        const regEmail = sessionStorage.getItem('reg_email');
        if (regEmail) {
            document.getElementById('email-input').value = regEmail;
            showAlert('alert-box', 'Account created. Please log in.', 'info');
            sessionStorage.removeItem('reg_email');
        }

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            clearAlert('alert-box');
            const btn = document.getElementById('submit-btn');
            btn.disabled = true;
            btn.textContent = 'Logging in...';

            const form = e.target;
            const res = await Api.post('/auth/login', {
                email: form.email.value.trim(),
                password: form.password.value,
            });

            if (res?.success) {
                Auth.save(res.data.token, res.data.user);
                window.location.href = '/dashboard.html';
            } else {
                showAlert('alert-box', res?.message || 'Login failed');
                btn.disabled = false;
                btn.textContent = 'Log In';
            }
        });
    </script>
</body>
</html>
